# CodeRabbit AI Code Review Configuration
# Docs: https://docs.coderabbit.ai/configuration/

# Language for review comments
language: en-US

reviews:
  # Review style: chill (lenient) / assertive (strict)
  profile: assertive
  # Allow CodeRabbit to formally request changes (requires setting CodeRabbit as a
  # required reviewer in the branch ruleset to take effect)
  request_changes_workflow: true
  # Generate a high-level summary for each PR
  high_level_summary: true
  # Disable the poem easter egg to stay professional
  poem: false
  # Show review status badge on PRs
  review_status: true
  # Collapse the walkthrough list
  collapse_walkthrough: true

  auto_review:
    enabled: true
    # Do not review draft PRs; review once marked ready
    drafts: false
    # Base branch to diff against
    base: main

  # Ignored paths (glob; "!" prefix excludes from review)
  path_filters:
    - "!bin/**"
    - "!.git/**"
    - "!**/*.sum"
    - "!**/*.lock"

  # Per-path review instructions
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Review following Go best practices:
        1. Error handling: prefer errors.Is / errors.As; avoid swallowed errors and bare panics.
        2. Concurrency safety: check goroutine lifecycles, channel closing, and shared-state races.
        3. Resource cleanup: ensure connection pools, file handles, and HTTP Response Bodies are closed.
        4. context usage: respect timeouts and cancellation propagation.
        5. Logging: use slog structured fields; do not concatenate log text.
    - path: "api/proto/**"
      instructions: |
        Review the proto contract:
        1. Field numbers must remain backward compatible (never reuse removed numbers).
        2. The first enum value must be UNSPECIFIED = 0.
        3. google.api.http annotations must map to the correct REST semantics.
    - path: "deployments/**"
      instructions: |
        Review deployment configuration:
        1. Image versions must be pinned and the latest stable.
        2. Health check commands and ports must be correct.
        3. No hardcoded secrets (should reference Secrets instead).
    - path: "internal/**"
      instructions: |
        Follow project layering conventions: config / logger / server are infrastructure;
        business packages such as bus / store / workflow / agent must not depend upward.

chat:
  auto_reply: true

