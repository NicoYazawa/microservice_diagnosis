<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Dashboard — MFDH</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --green: #4ade80; --red: #f87171;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Top nav */
    header { display: flex; align-items: center; gap: 1rem;
             padding: .75rem 1.5rem; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
    header .badge { font-size: .7rem; background: var(--card); padding: .2rem .5rem;
                    border-radius: 4px; color: var(--muted); }

    /* Layout */
    .container { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
    nav { border-right: 1px solid var(--border); padding: 1rem; }
    nav h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
             color: var(--muted); margin-bottom: .5rem; }
    nav ul { list-style: none; }
    nav li { padding: .4rem .5rem; border-radius: 6px; cursor: pointer; font-size: .85rem; }
    nav li:hover, nav li.active { background: var(--card); }
    nav li.active { color: var(--accent); }

    main { padding: 1.5rem; overflow-y: auto; }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
             gap: .75rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border);
                 border-radius: 10px; padding: 1rem; }
    .stat-card .label { font-size: .7rem; color: var(--muted); text-transform: uppercase; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: .25rem; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.amber { color: var(--amber); }
    .stat-card .value.red { color: var(--red); }

    /* Section headers */
    h2 { font-size: .9rem; font-weight: 600; margin-bottom: .75rem; color: var(--muted); }

    /* Session list */
    .session-list { display: flex; flex-direction: column; gap: .5rem; }
    .session-card { background: var(--card); border: 1px solid var(--border);
                    border-radius: 8px; padding: .85rem 1rem;
                    display: grid; grid-template-columns: 1fr auto auto;
                    gap: 1rem; align-items: center; cursor: pointer; }
    .session-card:hover { border-color: var(--accent); }
    .session-card .svc { font-weight: 500; font-size: .9rem; }
    .session-card .meta { font-size: .75rem; color: var(--muted); margin-top: .15rem; }
    .status-badge { font-size: .7rem; padding: .2rem .55rem; border-radius: 20px;
                    font-weight: 500; }
    .status-created    { background: #1e3a5f; color: #93c5fd; }
    .status-collecting { background: #3b2a0a; color: #fcd34d; }
    .status-analyzing  { background: #2e1065; color: #c4b5fd; }
    .status-resolved   { background: #14532d; color: #86efac; }
    .status-failed     { background: #7f1d1d; color: #fca5a5; }
    .status-awaiting   { background: #78350f; color: #fcd34d; }
    .btn { font-size: .75rem; padding: .3rem .75rem; border-radius: 6px;
           border: none; cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { opacity: .85; }

    /* Detail panel */
    #detail-panel { display: none; background: var(--card); border: 1px solid var(--border);
                    border-radius: 10px; padding: 1.25rem; margin-top: 1rem; }
    #detail-panel.visible { display: block; }
    #detail-panel h3 { font-size: 1rem; margin-bottom: .5rem; }
    #detail-panel .detail-meta { display: flex; gap: 1rem; font-size: .75rem; color: var(--muted); margin-bottom: 1rem; }
    #detail-tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    #detail-tabs button { background: none; border: none; color: var(--muted); cursor: pointer;
                          padding: .4rem .75rem; font-size: .8rem; border-bottom: 2px solid transparent; }
    #detail-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; font-size: .8rem; line-height: 1.7; }
    .tab-content.active { display: block; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
          padding: .75rem; overflow-x: auto; font-size: .75rem; color: var(--muted); }

    /* Empty state */
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-size: .85rem; }

    /* Refresh indicator */
    #last-updated { font-size: .7rem; color: var(--muted); margin-left: auto; }
  </style>
</head>
<body>

<header>
  <h1>MFDH</h1>
  <span class="badge">microservice-diagnosis</span>
  <button class="btn btn-primary" onclick="createSession()" style="margin-left:auto">+ New Session</button>
  <span id="last-updated"></span>
</header>

<div class="container">
  <nav>
    <h3>Views</h3>
    <ul>
      <li class="active" onclick="filterView('all')">All Sessions</li>
      <li onclick="filterView('active')">Active</li>
      <li onclick="filterView('resolved')">Resolved</li>
      <li onclick="filterView('failed')">Failed</li>
    </ul>
    <h3 style="margin-top:1.5rem">Services</h3>
    <ul id="service-list"></ul>
  </nav>

  <main>
    <div class="stats">
      <div class="stat-card"><div class="label">Total</div><div class="value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="label">Active</div><div class="value amber" id="stat-active">—</div></div>
      <div class="stat-card"><div class="label">Resolved</div><div class="value green" id="stat-resolved">—</div></div>
      <div class="stat-card"><div class="label">Failed</div><div class="value red" id="stat-failed">—</div></div>
    </div>

    <h2>Sessions</h2>
    <div id="session-list" class="session-list">
      <div class="empty">Loading sessions…</div>
    </div>

    <div id="detail-panel">
      <h3 id="detail-title">Session Detail</h3>
      <div class="detail-meta">
        <span id="detail-id"></span>
        <span id="detail-status"></span>
        <span id="detail-service"></span>
      </div>
      <div id="detail-tabs">
        <button class="active" onclick="showTab('timeline')">Timeline</button>
        <button onclick="showTab('report')">Report</button>
      </div>
      <div id="tab-timeline" class="tab-content active">
        <div id="timeline-content"></div>
      </div>
      <div id="tab-report" class="tab-content">
        <div id="report-content" style="margin-bottom:.5rem"></div>
        <button class="btn btn-primary" onclick="downloadReport()">Download Report</button>
      </div>
    </div>
  </main>
</div>

<script>
const API = ''; // Use same origin; set to '/api' or empty string
let sessions = [];
let currentFilter = 'all';
let currentSessionId = null;

async function fetchJSON(url, opts) {
  const r = await fetch(API + url, opts);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function loadSessions() {
  try {
    const data = await fetchJSON('/v1/sessions?page_size=100');
    sessions = (data.sessions || []).map(s => ({
      ...s,
      status: s.status.replace('SESSION_STATUS_', '').toLowerCase()
    }));
    renderStats();
    renderSessionList();
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) { console.error(e); }
}

function renderStats() {
  const total = sessions.length;
  const active = sessions.filter(s => !['resolved','rejected','ignored','failed'].includes(s.status)).length;
  const resolved = sessions.filter(s => s.status === 'resolved').length;
  const failed = sessions.filter(s => ['failed','rejected'].includes(s.status)).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-resolved').textContent = resolved;
  document.getElementById('stat-failed').textContent = failed;
}

function filterView(f) { currentFilter = f; renderSessionList(); }

function renderSessionList() {
  const list = document.getElementById('session-list');
  let filtered = sessions;
  if (currentFilter === 'active') filtered = sessions.filter(s => !['resolved','rejected','ignored','failed'].includes(s.status));
  else if (currentFilter === 'resolved') filtered = sessions.filter(s => s.status === 'resolved');
  else if (currentFilter === 'failed') filtered = sessions.filter(s => ['failed','rejected'].includes(s.status));
  if (!filtered.length) { list.innerHTML = '<div class="empty">No sessions found</div>'; return; }
  list.innerHTML = filtered.map(s => `
    <div class="session-card" onclick="showSessionDetail('${s.id}')">
      <div>
        <div class="svc">${s.targetService || '—'}</div>
        <div class="meta">${s.id} · ${timeAgo(s.createdAt)}</div>
      </div>
      <span class="status-badge status-${s.status}">${s.status.replace('_',' ')}</span>
      <button class="btn btn-primary" onclick="event.stopPropagation(); startSession('${s.id}')">Start</button>
    </div>`).join('');
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts.seconds ? ts.seconds * 1000 : ts);
  const diff = Math.floor((Date.now() - d) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

async function showSessionDetail(id) {
  currentSessionId = id;
  const s = sessions.find(s => s.id === id);
  if (!s) return;
  document.getElementById('detail-panel').classList.add('visible');
  document.getElementById('detail-title').textContent = 'Session ' + (s.targetService || id.slice(0,8));
  document.getElementById('detail-id').textContent = 'ID: ' + id;
  document.getElementById('detail-status').innerHTML = `<span class="status-badge status-${s.status}">${s.status}</span>`;
  document.getElementById('detail-service').textContent = 'Service: ' + (s.targetService || '—');
  showTab('timeline');
  // Fetch full session detail.
  try {
    const data = await fetchJSON('/v1/sessions/' + id);
    renderTimeline(data.detail || {});
  } catch(e) { console.error(e); }
}

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('#detail-tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector(`#detail-tabs button[onclick="showTab('${name}')"]`).classList.add('active');
}

async function renderTimeline(detail) {
  const tl = document.getElementById('timeline-content');
  const events = detail.timeline || [];
  if (!events.length) { tl.innerHTML = '<div class="empty">No timeline events recorded</div>'; return; }
  tl.innerHTML = events.map(ev => `
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
      <div style="width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:.4rem;flex-shrink:0"></div>
      <div>
        <div style="font-size:.75rem;color:var(--muted)">${timeAgo(ev.timestamp)} · ${ev.source}</div>
        <div style="font-size:.82rem">${ev.message}</div>
      </div>
    </div>`).join('');
}

async function loadReport() {
  if (!currentSessionId) return;
  const btn = event.target;
  btn.textContent = 'Loading…';
  try {
    const data = await fetchJSON('/v1/sessions/' + currentSessionId + '/report?format=markdown');
    document.getElementById('report-content').innerHTML = '<pre>' + escapeHtml(data.content || 'No content') + '</pre>';
  } catch(e) {
    document.getElementById('report-content').innerHTML = '<div class="empty">Failed to load report: ' + e.message + '</div>';
  }
  btn.textContent = 'Download Report';
}

function downloadReport() { window.open(API + '/v1/sessions/' + currentSessionId + '/report/download', '_blank'); }

async function createSession() {
  const svc = prompt('Target service name:');
  if (!svc) return;
  try {
    await fetchJSON('/v1/sessions', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({targetService: svc})
    });
    loadSessions();
  } catch(e) { alert('Failed: ' + e.message); }
}

async function startSession(id) {
  try {
    await fetchJSON('/v1/sessions/' + id + '/start', {method:'POST'});
    loadSessions();
  } catch(e) { alert('Failed: ' + e.message); }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Load report on tab switch
const origShowTab = showTab;
showTab = function(name) {
  origShowTab(name);
  if (name === 'report' && !document.getElementById('report-content').textContent) loadReport();
};

// Refresh every 15s.
loadSessions();
setInterval(loadSessions, 15000);
</script>
</body>
</html>
