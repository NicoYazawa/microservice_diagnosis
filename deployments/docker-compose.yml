name: mfdh

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: mfdh-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "29092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [diagnosis-net]

  postgres:
    image: postgres:18-alpine
    container_name: mfdh-postgres
    environment:
      POSTGRES_USER: mfdh
      POSTGRES_PASSWORD: mfdh
      POSTGRES_DB: diagnosis
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfdh -d diagnosis"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [diagnosis-net]

  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: mfdh-clickhouse
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [diagnosis-net]

  redis:
    image: redis:8-alpine
    container_name: mfdh-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [diagnosis-net]

  consul:
    image: hashicorp/consul:2.0.3
    container_name: mfdh-consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [diagnosis-net]

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: mfdh-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [diagnosis-net]

volumes:
  pgdata:
  chdata:
  promdata:

networks:
  diagnosis-net:
    name: diagnosis-net
